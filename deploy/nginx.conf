# hxc236.cn 个人主页 —— HTTPS 阶段 Nginx 站点配置（#13 腾讯云 Lighthouse 部署）
# 职责：托管前端静态文件（SPA 回退）+ 把 /api/ 与 OAuth 路径反代到后端容器。
# 证书：Let's Encrypt（certbot），续期由宿主机 cron 负责（docs/deploy.md §4.7）。
# 证书签发前请使用 nginx.http.conf（改 .env 的 NGINX_CONF 后重启 web 服务）。

# ---- HTTP：ACME 证书校验 + 强制跳转 HTTPS ----
server {
    listen 80;
    server_name hxc236.cn www.hxc236.cn;

    # Let's Encrypt 校验路径（certbot --webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：站点主体 ----
server {
    listen 443 ssl;
    http2 on;
    server_name hxc236.cn www.hxc236.cn;

    ssl_certificate     /etc/letsencrypt/live/hxc236.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hxc236.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端构建产物（myblogweb 多阶段镜像提供）
    root /usr/share/nginx/html;
    index index.html;

    # API 反代 → 后端容器：浏览器请求 https://hxc236.cn/api/... 与后端同源，无跨域
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # GitHub OAuth 登录入口与回调（Spring Security 默认路径，位于 /api 之外）
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA 回退：命中真实静态文件则返回文件，其余路径回到应用入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}
