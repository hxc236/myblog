# hxc236.cn 个人主页 —— HTTP 阶段 Nginx 配置（#13，证书签发前使用）
# 用途：备案期间/证书签发前以 HTTP 验收整站；同时服务 ACME 校验路径。
# 证书签发后切换 deploy/nginx.conf 启用 HTTPS（docs/deploy.md §4.7）。

server {
    listen 80;
    server_name hxc236.cn www.hxc236.cn;

    # Let's Encrypt 校验路径（certbot --webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    # API 反代 → 后端容器
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # GitHub OAuth 登录入口与回调（Spring Security 默认路径，位于 /api 之外）
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
